# daily.calendarshop.online — DailyCalendarShop
#
# Mirrors the working /etc/nginx/sites-available/ecomm config, with:
#   * ports 5100 (API) / 4020 (SSR) instead of 5080 / 4000
#   * paths under /var/www/dailycal
#   * X-Robots-Tag noindex, because this is a TESTING domain (remove for production)
#
# Install:
#   cp deploy/nginx-dailycal.conf /etc/nginx/sites-available/dailycal
#   ln -s /etc/nginx/sites-available/dailycal /etc/nginx/sites-enabled/dailycal
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d daily.calendarshop.online
#
# NOTE: certbot rewrites this file in place, adding the listen 443 / ssl_certificate
# lines and the port-80 redirect server block. Run it AFTER the DNS A record resolves.

server {
    server_name daily.calendarshop.online;

    client_max_body_size 25M;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

    # Security headers. NOTE: nginx add_header does not merge — if any location block
    # below adds its own add_header, it drops every one of these. None currently do.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security max-age=31536000 always;
    # TESTING DOMAIN ONLY — delete this line when this config is used for production.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location /uploads/ {
        alias /var/www/dailycal/uploads/;
        expires 30d;
        access_log off;
    }

    location = /sitemap.xml { proxy_pass http://127.0.0.1:5100/api/sitemap.xml; }

    # SignalR (real-time notification bell). Needs the WebSocket upgrade headers and a
    # long read timeout — without this block the hub silently falls back or drops.
    location /hubs/ {
        proxy_pass http://127.0.0.1:5100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else → Angular SSR (Node on 4020).
    # NOT try_files/index.html: an SSR build emits no static index.html,
    # only index.csr.html and index.server.html.
    location / {
        proxy_pass http://127.0.0.1:4020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 80;
}
