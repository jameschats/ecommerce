# dailycalendarstore.in — DailyCalendarShop, production
#
# Replaces deploy/nginx-dailycal.conf, which served the shop from
# daily.calendarshop.online while that was a testing address. Same app, same
# ports (5100 API / 4020 SSR), same paths under /var/www/dailycal — only the
# name in front of it changes.
#
# Two differences from the old file, both deliberate:
#   * No X-Robots-Tag noindex. The old one carried it because it was a testing
#     domain. Carrying it here would tell every search engine to ignore the real
#     shop, which is the one mistake in this move that would go unnoticed for
#     months.
#   * www is served alongside the bare name so certbot covers both; the redirect
#     from www to the canonical bare name is added by the second block below.
#
# Install (after the domain resolves — certbot needs a live A record):
#   scp deploy/nginx-dailycalendarstore.conf root@62.72.59.84:/etc/nginx/sites-available/dailycalendarstore
#   ln -sf /etc/nginx/sites-available/dailycalendarstore /etc/nginx/sites-enabled/dailycalendarstore
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d dailycalendarstore.in -d www.dailycalendarstore.in
#
# certbot rewrites this file in place, adding the listen 443 / ssl_certificate
# lines and a port-80 redirect block. That is expected; this file stays the
# source of truth for everything above the TLS lines.

server {
    # The canonical name only. www lives in its own block at the bottom — naming it in both
    # would give nginx two server blocks answering to it, and it would silently pick the first
    # and warn about the conflict.
    server_name dailycalendarstore.in;

    client_max_body_size 25M;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

    # Security headers. NOTE: nginx add_header does not merge — if any location block
    # below adds its own add_header, it drops every one of these. None currently do.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security max-age=31536000 always;

    location /uploads/ {
        alias /var/www/dailycal/uploads/;
        expires 30d;
        access_log off;
    }

    location = /sitemap.xml { proxy_pass http://127.0.0.1:5100/api/sitemap.xml; }

    # SignalR (real-time notification bell). Needs the WebSocket upgrade headers and a
    # long read timeout — without this block the hub silently falls back or drops.
    location /hubs/ {
        proxy_pass http://127.0.0.1:5100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else → Angular SSR (Node on 4020).
    # NOT try_files/index.html: an SSR build emits no static index.html,
    # only index.csr.html and index.server.html.
    location / {
        proxy_pass http://127.0.0.1:4020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 80;
}

# www → the bare name. One canonical address, so search engines and the SSR
# build never disagree about which of the two is the real shop.
server {
    server_name www.dailycalendarstore.in;
    return 301 https://dailycalendarstore.in$request_uri;
    listen 80;
}
