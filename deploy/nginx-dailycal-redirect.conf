# daily.calendarshop.online — retired, redirect only.
#
# Replaces the serving config now that the shop lives at dailycalendarstore.in. It keeps
# nothing but a 301, so bookmarks, links shared over WhatsApp and the URLs in order emails
# already sent all still land in the right place.
#
# Keep for roughly six months, then this file, the certificate and the DNS record can all
# go. It does not stand in the way of reusing calendarshop.online for something else —
# that is the apex, this is one subdomain, and they are separate server blocks.
#
# The 443 block is not optional. The old config sent HSTS with a one-year max-age, so every
# browser that has visited will refuse to try port 80 at all — a redirect that only listened
# on 80 would be invisible to exactly the people it is meant to catch.
#
# No X-Robots-Tag here either. The old config carried noindex because this was a testing
# address, but a redirect that crawlers are told to ignore is a redirect they will not
# follow, which defeats the point of keeping it.
#
# Install:
#   scp deploy/nginx-dailycal-redirect.conf root@62.72.59.84:/etc/nginx/sites-available/dailycal
#   nginx -t && systemctl reload nginx

server {
    server_name daily.calendarshop.online;

    # $request_uri keeps path and query string, so a link to a specific product lands on
    # that product rather than dumping everyone on the home page.
    return 301 https://dailycalendarstore.in$request_uri;

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/daily.calendarshop.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/daily.calendarshop.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    server_name daily.calendarshop.online;
    return 301 https://dailycalendarstore.in$request_uri;
    listen 80;
}
