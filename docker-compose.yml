# Local: `cp .env.docker.example .env.docker` (fill in), then `cp docker-compose.override.yml.example
# docker-compose.override.yml`, then `docker compose up -d --build` - compose auto-loads
# docker-compose.override.yml if present. The VPS's own override supplies its real env file + bind
# mounts + ports instead - see documents/v4-stages/phase-0-portability.md for the full cutover plan.
#
# Deliberately no env_file or ports here, on either service: both are list-type compose keys that
# MERGE across override files rather than replacing (confirmed the hard way - an early version of
# this file hardcoded 5090:5090 here, and the VPS override's 5091:5090 merged ALONGSIDE it instead of
# replacing it, which would have tried to bind the same host port the live systemd service was
# already using). Every environment supplies its own complete env_file and ports lists via its own
# override - never assume a list-type key here is safe to also set in an override.
#
# MySQL and Nginx are deliberately NOT containerized here (see that doc's "Explicitly out of scope"
# section).
services:
  api:
    build:
      context: .
      dockerfile: ecomm.api/Dockerfile
    environment:
      # Override whatever env_file provides for these two - the container-internal mount points
      # below, not wherever the bare-metal deploy happened to configure. DataProtection keys and
      # uploaded media must survive container recreation - see phase-0-portability.md.
      - DataProtection__KeysPath=/data/dp-keys
      - Media__UploadPath=/data/uploads
    extra_hosts:
      # Lets the container reach bare-metal MySQL on the host. No-op on Docker Desktop (which
      # already resolves this), required on native Linux Docker Engine (the VPS).
      - "host.docker.internal:host-gateway"
    volumes:
      - dp-keys:/data/dp-keys
      - uploads:/data/uploads
    restart: unless-stopped

  ssr:
    build:
      context: .
      dockerfile: ecomm.web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api

volumes:
  dp-keys:
  uploads:
